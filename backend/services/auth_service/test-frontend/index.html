<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Swayam Login Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #111;
      color: white;
    }

    .container {
      width: 430px;
      padding: 32px;

      background: #1c1c1c;

      border-radius: 14px;

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;

      margin-top: 16px;
      margin-bottom: 7px;

      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;

      padding: 12px;

      border: 1px solid #444;
      border-radius: 7px;

      background: #111;
      color: white;

      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;

      margin-top: 22px;
      padding: 13px;

      border: none;
      border-radius: 7px;

      background: #d4af37;
      color: #111;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #e5c45a;
    }

    #status {
      margin-top: 20px;

      font-weight: bold;
      text-align: center;
    }

    #user {
      margin-top: 15px;

      padding: 12px;

      background: #111;
      border-radius: 7px;

      white-space: pre-wrap;

      color: #ccc;
    }

    #token {
      height: 150px;

      resize: vertical;

      font-size: 11px;
      font-family: monospace;
    }

    .copy-button {
      margin-top: 8px;

      background: #333;
      color: white;

      font-weight: normal;
    }

    .copy-button:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Swayam</h1>

    <div class="subtitle">
      Authentication Test
    </div>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="organizer@test.com"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginButton">
      Login
    </button>

    <div id="status"></div>

    <div id="user"></div>

    <label for="token">
      Firebase ID Token
    </label>

    <textarea
      id="token"
      readonly
      placeholder="Token will appear here after login..."
    ></textarea>

    <button
      class="copy-button"
      id="copyButton"
    >
      Copy Token
    </button>

  </div>

  <script
    type="module"
    src="./app.js">
  </script>

</body>

</html>
