  document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,suf=el.dataset.s||'',set=v=>el.textContent=v.toLocaleString('en-IN')+suf;if(red)return set(n);

const ink=()=>lum(th.a)>.179?'#000':'#fff';
const vars=()=>{const r=document.documentElement.style;r.setProperty('--a',th.a);r.setProperty('--bg',th.bg);r.setProperty('--ab',ink());document.body.classList.toggle('nospot',!th.s);sv('sw_theme',th)};
const panel=()=>{document.getElementById('sw').innerHTML=th.open?`<div class="swp"><h3>Colour options <button class="lb" data-sw="toggle" aria-label="Close colour options">Close</button></h3><p class="sl">Accent</p><div class="sws">${presets.map(p=>`<button data-a="${p[1]}" aria-pressed="${th.a==p[1]}"><i style="background:${p[1]}"></i>${p[0]}</button>`).join('')}</div><label>Custom <input type="color" id="swc" value="${th.a}" aria-label="Custom accent colour"></label><p class="sl">Background</p><div class="sws">${bgs.map(p=>`<button data-bg="${p[1]}" aria-pressed="${th.bg==p[1]}"><i style="background:${p[1]}"></i>${p[0]}</button>`).join('')}</div><p class="sl">Cursor spark</p><div class="sws">${[['1','On'],['0','Off']].map(p=>`<button data-s="${p[0]}" aria-pressed="${(th.s?'1':'0')==p[0]}">${p[1]}</button>`).join('')}</div><p class="sl">Paste into index.css (button text: ${ink()=='#000'?'black':'white'}):</p><code>--accent:${th.a};<br>--bg:${th.bg};</code></div>`:'<button class="swb" data-sw="toggle">Colours</button>'};
document.getElementById('sw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.sw)th.open=!th.open;else if(d.a)th.a=d.a;else if(d.bg)th.bg=d.bg;else if(d.s!==undefined)th.s=d.s=='1';else return;vars();panel()});
document.getElementById('sw').addEventListener('input',e=>{if(e.target.id=='swc'){th.a=e.target.value;vars();const c=document.querySelector('.swp code');if(c)c.innerHTML='--accent:'+th.a+';<br>--bg:'+th.bg+';'}});
vars();panel();syncQ();render();
</script></body></html>
