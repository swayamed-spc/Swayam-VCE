<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emblemRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.5" />
    </linearGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="url(#emblemRing)" stroke-width="3" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#2b6bff" stroke-opacity="0.4" stroke-width="2" transform="rotate(35 50 50)" />
  
  <circle cx="20" cy="30" r="4" fill="#ff7a3d" filter="url(#emblemGlow)" />
  <circle cx="82" cy="65" r="4" fill="#4facfe" filter="url(#emblemGlow)" />

  <path d="M 50 15 
           C 65 25, 70 38, 58 48 
           C 48 56, 32 60, 42 75 
           C 50 88, 70 82, 66 68
           C 64 62, 56 60, 56 60
           C 60 70, 48 76, 42 68
           C 34 58, 52 50, 56 42
           C 60 34, 48 26, 40 32
           C 46 22, 50 15, 50 15 Z" 
        fill="url(#emblemGradient)" 
        filter="url(#emblemGlow)" />

  <circle cx="50" cy="50" r="8" fill="#ffffff" fill-opacity="0.9" filter="url(#emblemGlow)" />
</svg>
