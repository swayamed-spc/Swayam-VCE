<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Core Glow Gradients -->
    <linearGradient id="swayamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.4" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="url(#ringGradient)" stroke-width="2.5" transform="rotate(-30 50 50)" stroke-dasharray="180 30" />
    <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#2b6bff" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(35 50 50)" />
    
    <!-- Core Orbital Nodes -->
    <circle cx="20" cy="30" r="3.5" fill="#ff7a3d" filter="url(#logoGlow)" />
    <circle cx="82" cy="65" r="3.5" fill="#4facfe" filter="url(#logoGlow)" />

    <!-- Stylized 'S' Ember Flame -->
    <path d="M 50 15 
             C 65 25, 70 38, 58 48 
             C 48 56, 32 60, 42 75 
             C 50 88, 70 82, 66 68
             C 64 62, 56 60, 56 60
             C 60 70, 48 76, 42 68
             C 34 58, 52 50, 56 42
             C 60 34, 48 26, 40 32
             C 46 22, 50 15, 50 15 Z" 
          fill="url(#swayamGradient)" 
          filter="url(#logoGlow)" />

    <circle cx="50" cy="50" r="8" fill="#ffffff" fill-opacity="0.9" filter="url(#logoGlow)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(120, 25)">
    <!-- SWAYAM Title -->
    <text x="0" y="45" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#FFFFFF">
      SWAYAM
    </text>
    <!-- E-CELL Subtitle -->
    <text x="2" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="14" letter-spacing="8" fill="#FF7A3D" opacity="0.9">
      ENTREPRENEURSHIP CELL
    </text>
    <!-- Dot accent -->
    <circle cx="260" cy="66" r="3" fill="#2B6BFF" />
  </g>
</svg>
